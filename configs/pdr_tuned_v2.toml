# 2차 튜닝 결과 (2026-10-16). 데이터는 1차와 같고(10세션), 고르는 방식을 교차검증으로 바꿈.
# 교차검증 예상 오차: 걸음 수 3.1%, 거리 9.1%. 과정과 근거는 docs/tuning_log.md 참고.

fs = 100.0

[preprocess]
lpf_cutoff_hz = 3.0
lpf_order = 4
mode = "offline"
delay_s = 0.5
window_s = 3.0
hop_s = 0.1

[step]
signal = "vertical"
min_height = 0.15
min_prominence = 0.5
min_interval_s = 0.5
max_interval_s = 2.0

[length]
model = "weinberg"
k = 0.3591
exponent = 0.55
k_freq = 0.0
offset_m = 0.0
constant_m = 0.6
min_m = 0.1
max_m = 1.2

[heading]
source = "gyro"
zaru = false
still_acc_std = 0.15
still_gyro_std = 0.05
still_window_s = 1.0
step_average = true
